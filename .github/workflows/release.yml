name: Release

on:
  push:
    tags: ['v*.*.*']
  # Manual re-run. Dispatched from a branch it builds and uploads a workflow
  # artifact but publishes nothing; dispatched from a tag it behaves like a
  # tag push.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the release and upload assets

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # __BUILD_NUMBER__, see vite.config.ts

      # Before anything expensive. A tag that disagrees with the manifests
      # should cost seconds, not a 40-minute llama.cpp build.
      - name: Version consistency
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./scripts/check-version.sh "$GITHUB_REF_NAME"
          else
            ./scripts/check-version.sh
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Distinct from CI's debug-profile cache.
          key: release
          cache-on-failure: true

      # Updater signatures are mandatory and are unrelated to Apple's optional
      # Developer ID signature. Fail before the expensive local-LLM compile if
      # the repository has not been provisioned with the generated private key.
      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          fi

      # No separate frontend build: tauri.conf.json already sets
      # beforeBuildCommand: "npm run build". --target is explicit so the bundle
      # path is deterministic regardless of what the runner's host arch is.
      #
      # Apple Silicon only, matching the README ("Intel is untested") — a
      # universal binary would compile llama.cpp and its Metal kernels twice.
      #
      # The APPLE_* secrets are the entire signing switch. Tauri's bundler reads
      # them natively and signs + notarizes with hardened runtime once they are
      # populated. Adding the secrets needs no edit here.
      #
      # The unset case is NOT free, though, and the obvious spelling of it is
      # wrong: an absent GitHub secret expands to an EMPTY STRING, so the
      # variable still exists in the environment, and the bundler switches on
      # presence rather than on content. A keyless build therefore did not fall
      # back to an unsigned DMG — it tried to import an empty certificate and
      # died with `SecKeychainItemImport: One or more parameters ... not valid`
      # AFTER the full llama.cpp compile. Dropping the empties in the same shell
      # that runs the build is what makes the documented fallback real; `npm run`
      # inherits this environment, so the unset reaches the bundler.
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v:-}" ] || unset "$v"
          done
          # With no Developer ID, AD-HOC sign rather than ship an unsigned
          # bundle. `-` is Tauri's documented pseudo-identity and needs no
          # certificate, no Apple ID and no paid membership, so this arm is what
          # every keyless build gets.
          #
          # It is not cosmetic. Without it the bundler skips codesign entirely
          # and the .app carries only the LINKER's implicit ad-hoc mark on the
          # Mach-O: `Sealed Resources=none`, no _CodeSignature, and a placeholder
          # identifier. `codesign --verify` then rejects it outright ("code has
          # no resources but signature indicates they must be present"), which is
          # an INVALID signature rather than an untrusted one — macOS reports
          # that as "damaged and can't be opened", with no Open Anyway button to
          # recover with. Ad-hoc signing seals the bundle, restores the real
          # com.veviad.terminal identifier, and puts the app back on the ordinary
          # unidentified-developer path the release notes describe.
          #
          # Notarization is untouched: it keys off APPLE_ID/APPLE_PASSWORD/
          # APPLE_TEAM_ID, which stay unset here.
          : "${APPLE_SIGNING_IDENTITY:=-}"
          export APPLE_SIGNING_IDENTITY
          cargo build --manifest-path src-tauri/Cargo.toml --bin vterminal-docs \
            --release --features local-llm --target aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp src-tauri/target/aarch64-apple-darwin/release/vterminal-docs \
            src-tauri/binaries/vterminal-docs-aarch64-apple-darwin
          npm run tauri build -- --features local-llm --target aarch64-apple-darwin --config src-tauri/tauri.updater.conf.json

      # Report what was actually produced, not what secrets were configured.
      # An ad-hoc signature satisfies `codesign --verify` but is still
      # quarantined, so the authority line is the thing worth matching.
      - name: Inspect signature
        id: sign
        run: |
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VTerminal.app

          # Validity FIRST, and it is a hard failure. 0.1.0 shipped a bundle
          # whose signature did not verify at all, and nothing here caught it
          # because this step only ever asked whether the signature was
          # TRUSTED. Those are different questions: untrusted is the expected,
          # recoverable state for a keyless build, whereas invalid means macOS
          # calls the download damaged and offers no way to open it.
          if ! codesign --verify --strict "$app" 2>&1; then
            echo "::error::Bundle signature does not verify — see the ad-hoc signing note in the Build step."
            codesign -dvv "$app" 2>&1 || true
            exit 1
          fi

          if codesign -dvv "$app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo '::warning::DMG is ad-hoc signed but not notarized — add the APPLE_* secrets for Developer ID signing.'
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          # Without nullglob an empty bundle dir leaves the pattern literal and
          # cp fails with a confusing error instead of the clear one below.
          shopt -s nullglob
          mkdir -p release-assets
          found=0
          for f in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            # Tauri leaves rw.*.dmg scratch images beside the real one.
            case "$(basename "$f")" in rw.*) continue ;; esac
            cp "$f" release-assets/
            found=$((found + 1))
          done
          if [ "$found" -ne 1 ]; then
            echo "error: expected exactly one .dmg, found $found" >&2
            ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/ >&2 || true
            exit 1
          fi

          updater=(src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz)
          if [ "${#updater[@]}" -ne 1 ] || [ ! -f "${updater[0]}.sig" ]; then
            echo "error: expected one signed macOS updater bundle" >&2
            ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ >&2 || true
            exit 1
          fi
          cp "${updater[0]}" "${updater[0]}.sig" release-assets/
          cd release-assets
          shasum -a 256 *.dmg > SHA256SUMS.txt
          echo '${{ steps.sign.outputs.signed }}' > MAC_SIGNED.txt
          cat SHA256SUMS.txt

      # Uploaded before the release step, so a failure there still leaves the
      # build downloadable rather than throwing away 40 minutes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vterminal-macos-aarch64
          path: release-assets/
          if-no-files-found: error


  windows:
    name: Windows 11 (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $required = @(
            $env:TAURI_SIGNING_PRIVATE_KEY,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TENANT_ID,
            $env:AZURE_ARTIFACT_SIGNING_ENDPOINT,
            $env:AZURE_ARTIFACT_SIGNING_ACCOUNT,
            $env:AZURE_ARTIFACT_SIGNING_PROFILE
          )
          if ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            throw 'Windows releases require the Tauri updater key and Azure Artifact Signing configuration.'
          }

      - name: Install build prerequisites
        shell: pwsh
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc
          choco install vulkan-sdk -y --no-progress
          $sdk = [Environment]::GetEnvironmentVariable('VULKAN_SDK', 'Machine')
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'Vulkan SDK installation did not set VULKAN_SDK.' }
          Get-Command ninja -ErrorAction Stop | Out-Null
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          cargo install artifact-signing-cli --locked

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: windows-release
          cache-on-failure: true

      - name: Build signed NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: ./scripts/build-windows.ps1 -RequireSigning

      - name: Verify and collect artifacts
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installer = @(Get-ChildItem $bundle -Filter '*setup.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one NSIS setup executable, found $($installer.Count)." }
          $updaterSignature = "$($installer[0].FullName).sig"
          if (-not (Test-Path $updaterSignature)) { throw 'The signed Windows updater signature is missing.' }
          $authenticode = Get-AuthenticodeSignature $installer[0].FullName
          if ($authenticode.Status -ne 'Valid') { throw "Installer Authenticode status is $($authenticode.Status)." }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $installer[0].FullName release-assets/
          Copy-Item $updaterSignature release-assets/
          $hash = Get-FileHash $installer[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer[0].Name)" | Set-Content release-assets/SHA256SUMS-WINDOWS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vterminal-windows-x64
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Atomic release
    needs: [macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Compose release and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp artifacts/vterminal-macos-aarch64/* release-assets/
          cp artifacts/vterminal-windows-x64/* release-assets/
          mac_signed=$(cat release-assets/MAC_SIGNED.txt)
          rm release-assets/MAC_SIGNED.txt release-assets/SHA256SUMS-WINDOWS.txt
          cd release-assets
          sha256sum *.dmg *setup.exe > SHA256SUMS.txt
          cd ..

          : > NOTES.md
          if [ "$mac_signed" != true ]; then
            cat >> NOTES.md <<'EOF'
          > **The macOS build is ad-hoc signed and not notarized.** If Gatekeeper
          > blocks it, use System Settings → Privacy & Security → Open Anyway.

          EOF
          fi
          cat >> NOTES.md <<'EOF'
          Windows 11 requires WSL2 with a default distribution and Bash. The
          Windows installer, application, and companion CLI are Authenticode signed.

          Verify downloads with `shasum -a 256 -c SHA256SUMS.txt` on macOS or
          `Get-FileHash .\VTerminal_*_x64-setup.exe -Algorithm SHA256` on Windows.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never use --clobber against a public release: gh uploads assets
            # one at a time, which would expose a mixed platform/manifest set
            # until the last upload completed. A failed draft can be resumed,
            # but a published tag is immutable and must be superseded by a new
            # version instead.
            is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$is_draft" != true ]; then
              echo "::error::Release $TAG is already published; refusing to clobber public assets. Publish a new tag instead."
              exit 1
            fi
          else
            create=(gh release create "$TAG" --draft --title "VTerminal $TAG" --notes "$(cat NOTES.md)" --generate-notes)
            case "$TAG" in *-*) create+=(--prerelease) ;; esac
            "${create[@]}"
          fi
          notes=$(gh release view "$TAG" --json body --jq .body)
          mac=(release-assets/*.app.tar.gz)
          windows=(release-assets/*setup.exe)
          [ "${#mac[@]}" -eq 1 ] && [ "${#windows[@]}" -eq 1 ]
          mac_signature=$(cat "${mac[0]}.sig")
          windows_signature=$(cat "${windows[0]}.sig")
          base="https://github.com/Veviad/VTerminal/releases/download/$TAG"
          jq -n \
            --arg version "${TAG#v}" --arg notes "$notes" \
            --arg mac_signature "$mac_signature" --arg mac_url "$base/$(basename "${mac[0]}")" \
            --arg windows_signature "$windows_signature" --arg windows_url "$base/$(basename "${windows[0]}")" \
            '{version: $version, notes: $notes, platforms: {"darwin-aarch64": {signature: $mac_signature, url: $mac_url}, "windows-x86_64": {signature: $windows_signature, url: $windows_url}}}' \
            > release-assets/latest.json
          jq -e '.platforms["darwin-aarch64"].signature != "" and .platforms["windows-x86_64"].signature != ""' release-assets/latest.json >/dev/null

      - name: Upload all platform assets together
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::Release $TAG became public before upload; refusing to clobber its assets."
            exit 1
          fi

          # A resumed draft may retain assets from an older failed attempt.
          # Remove only names absent from this complete local transaction, then
          # replace the expected names while the release remains hidden.
          while IFS= read -r asset; do
            [ -z "$asset" ] || [ -f "release-assets/$asset" ] || \
              gh release delete-asset "$TAG" "$asset" --yes
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          gh release upload "$TAG" release-assets/* --clobber

          expected=$(find release-assets -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Draft asset set is incomplete or unexpected; leaving $TAG hidden."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      # The release is deliberately a draft until both platform builds, both
      # updater signatures, the combined manifest, and every public artifact
      # are present. Publishing is the atomic visibility boundary and triggers
      # the Pages workflow that refreshes release.json/download links.
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ] || {
            echo "::error::Release $TAG is no longer a draft; refusing to publish over external changes."
            exit 1
          }
          expected=$(find release-assets -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          [ "$actual" = "$expected" ] || {
            echo "::error::Draft asset set changed before publication; leaving $TAG hidden."
            exit 1
          }
          gh release edit "$TAG" --draft=false
