name: Pages

# The renderer copies the hand-written site into a staging tree and enriches it
# with the current published-release metadata. The schedule keeps that dynamic
# data fresh even when a release is edited without a repository push.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/site-release/**
      - package.json
      - .github/workflows/pages.yml
  release:
    types: [published]
  schedule:
  - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  # Pages has a single live deployment, so queue rather than cancel — cancelling
  # in-progress would be the one case where a half-finished deploy is published.
  group: pages
  cancel-in-progress: false

# Read-only by default; the deploy job widens this for itself.
permissions:
  contents: read

jobs:
  # GitHub Pages currently accepts a deployment from a `release` event and
  # reports success, but can keep serving the previous artifact when that
  # release points at a commit that Pages already deployed. Re-dispatching the
  # workflow avoids that release-event-only path. See:
  # https://github.com/actions/deploy-pages/issues/383
  refresh-release:
    name: Refresh published release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

  build:
    name: Build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_version: ${{ steps.release.outputs.version }}
    steps:
      # Always deploy current main. A release event otherwise checks out its tag,
      # and workflow_dispatch can target another ref; neither should be allowed
      # to publish an obsolete or unreviewed renderer/site tree.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Render live release data
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/site-release/render.mjs --source docs --output "$RUNNER_TEMP/vterminal-pages"
          version=$(jq -er '.release.version' "$RUNNER_TEMP/vterminal-pages/release.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every asset is referenced relatively ("assets/…" at the root, "../assets/…"
      # from docs/legal/), so the site works at the custom domain, at the
      # project-page base path (/VTerminal/, which is what serves if docs/CNAME is
      # ever removed), and from a plain file:// open. Assert it across ALL pages,
      # not just index.html — an absolute path would 404 only once deployed, and
      # the sub-page is the easier one to get wrong.
      - name: No absolute asset paths
        run: |
          staging="$RUNNER_TEMP/vterminal-pages"
          if find "$staging" -name '*.html' -print0 | xargs -0 grep -nE '(src|href)="/[^/]'; then
            echo "::error::Absolute asset path found — paths must stay relative so the site survives being served from a base path."
            exit 1
          fi
          if find "$staging" -name '*.css' -print0 | xargs -0 grep -nE "url\\(['\"]?/[^/]"; then
            echo "::error::Absolute CSS asset path found — paths must stay relative so the site survives being served from a base path."
            exit 1
          fi

      # No `actions/configure-pages` step on purpose. It exists to enable Pages
      # and to emit base_path/base_url for generators that bake the base URL in
      # at build time — this renderer preserves only relative paths (the
      # check above enforces that), so nothing consumed its outputs. It also
      # calls GET /repos/{owner}/{repo}/pages, which needs the `pages`
      # permission; this job has only `contents: read`, so it failed the first
      # deploy with "Resource not accessible by integration". Dropping it is the
      # fix rather than widening the token — the build job has no reason to hold
      # write access to Pages when only `deploy` publishes.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/vterminal-pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required by deploy-pages: it mints an OIDC token to publish the artifact.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5 over v4 purely for the runtime: v4 declares `runs.using: node20`,
      # which the runners now force onto Node 24 and warn about on every run.
      # v5's changelog is that bump and nothing else.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # A successful deploy-pages result is not enough: release-event
      # deployments can be marked successful while the old artifact remains
      # live. Verify the public release feed with cache-busting retries so this
      # workflow cannot silently leave the download page stale again.
      - name: Verify live release version
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.release_version }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          live_url="${PAGE_URL%/}/release.json"
          observed=''
          for attempt in {1..12}; do
            observed=$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${live_url}?pages_run=${GITHUB_RUN_ID}&attempt=${attempt}" \
              | jq -r '.release.version // empty') || true
            if [ "$observed" = "$EXPECTED_VERSION" ]; then
              echo "Verified VTerminal $EXPECTED_VERSION at $live_url."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages serves VTerminal ${observed:-unknown}; expected $EXPECTED_VERSION."
          exit 1
