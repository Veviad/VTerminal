name: CI

# Runs on every PR into main, and on main itself. The push-to-main run is not
# redundant: it is the only run allowed to SAVE the cargo cache, so it is what
# makes subsequent PRs fast (see `save-if` below).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Supersede in-flight PR runs, but never cancel a main run — that is the one
  # populating the cache every PR restores from.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # vite.config.ts derives __BUILD_NUMBER__ from `git rev-list --count
          # HEAD` and falls back to "0" silently on a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Version consistency
        run: ./scripts/check-version.sh

      - name: Embedding release manifest
        run: npm run check:e5-manifest

      - name: Site release renderer fixtures
        run: npm run test:site-release

      # `tsc && vite build`. Deliberately the full build rather than a bare
      # `tsc --noEmit`: bundling catches what typechecking cannot, and
      # tsconfig.json already sets strict + noUnusedLocals + noUnusedParameters.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Its own job, on ubuntu, deliberately. rustfmt only parses source: it needs
  # no macOS, no dist stub and none of the dependency graph, so running it as a
  # step inside the Rust job would put a one-minute check on the 10x-billed
  # runner — and, worse, a formatting failure there would abort the job before
  # clippy or the tests ever ran, hiding every other result behind a whitespace
  # diff. Separate job means both failures surface in the same run.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          rustup show
          rustup component add rustfmt
      - run: cargo fmt --all --check
        working-directory: src-tauri

  rust:
    name: Rust
    # Pinned rather than macos-latest: llama-cpp-2 is under
    # cfg(target_os = "macos"), and the image should not shift underneath the
    # cargo cache. cmake and the Xcode CLT are preinstalled on this image.
    runs-on: macos-15
    # A hung job would otherwise run to the 6h default — at the 10x macOS
    # billing multiplier on a private repo that is 3600 billable minutes.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust-toolchain.toml (repo root) pins channel 1.97 but declares no
      # components, so clippy has to be added explicitly.
      # `rustup show` is what installs the pinned toolchain in the first place.
      - name: Install toolchain
        run: |
          rustup show
          rustup component add clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Restore-only on PRs so parallel PRs cannot thrash the cache; only
          # main writes it. This cache holds the llama.cpp cmake + Metal build
          # under target/debug/build/llama-cpp-sys-2-*/out, which is the
          # difference between a 30-minute job and a 6-minute one.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Keep that build even when a lint step fails, or a red main run
          # throws away half an hour of compilation.
          cache-on-failure: true

      # tauri::generate_context!() (src/lib.rs) embeds frontendDist at COMPILE
      # time, and dist/ is gitignored — without this the crate does not build at
      # all. A stub is enough: these steps never run the app, and a real
      # `vite build` here would be minutes of 10x-billed runner time to produce
      # bytes nothing reads. The frontend job builds dist for real.
      - name: Stub frontend assets
        run: |
          mkdir -p ../dist
          printf '<!doctype html><title>ci stub</title>' > ../dist/index.html

      # Both feature configurations, every time. `default = []`, so a
      # feature-off run skips the entire local inference engine and the #[cfg]
      # stub arms in commands/models.rs; a feature-on run is the only one that
      # compiles examples/ for real rather than as #[cfg(not(...))] stubs.
      # The smoke examples are compiled but never executed — each needs a real
      # .gguf passed as argv.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Clippy (local-llm)
        run: cargo clippy --all-targets --locked --features local-llm -- -D warnings

      - name: Test (local-llm)
        run: cargo test --locked --features local-llm

  windows:
    name: Windows 11 / WSL backend
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install toolchain
        run: |
          rustup show
          rustup component add clippy
          rustup target add x86_64-pc-windows-msvc

      - run: npm ci

      - name: Managed CLI PATH script
        run: ./scripts/windows-cli-path.tests.ps1

      - name: Stub frontend assets
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>ci stub</title>'

      # Tauri validates externalBin from the package build script even for
      # Clippy/tests, before Cargo can build this package's sidecar target.
      - name: Bootstrap Windows companion path
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force src-tauri/binaries/vterminal-docs-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      # The feature-off bundle has exactly one native sidecar and no llama/GGML
      # resource DLLs. Build its release profile after the faster source gates
      # so target-only errors fail before an expensive optimized build.
      - name: Stage Windows companion sidecar (feature-off)
        run: |
          # Replace the ignored bootstrap placeholder with the successfully
          # linked companion before either installer smoke runs.
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --target x86_64-pc-windows-msvc --bin vterminal-docs
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/vterminal-docs.exe src-tauri/binaries/vterminal-docs-x86_64-pc-windows-msvc.exe

      # Bundle without the local-llm feature or DLL resource overlay. This
      # compiles the real NSIS hooks, including their absent-runtime path, and
      # proves that only the required companion sidecar/common PATH resource is
      # needed by a cloud-only preview.
      - name: NSIS smoke bundle (feature-off)
        run: |
          $stagedLocalDlls = @(
            Get-ChildItem src-tauri/binaries/llama-runtime,src-tauri/binaries/llama-backends -Filter '*.dll' -File -ErrorAction SilentlyContinue
          )
          if ($stagedLocalDlls.Count -ne 0) {
            throw "Feature-off NSIS smoke must not stage llama/GGML DLLs: $($stagedLocalDlls.Name -join ', ')"
          }
          npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json
          $installer = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*setup.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one feature-off NSIS installer, found $($installer.Count)." }

      - name: Install Vulkan SDK
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = [Environment]::GetEnvironmentVariable('VULKAN_SDK', 'Machine')
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'Vulkan SDK installation did not set VULKAN_SDK.' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Clippy (local-llm, Vulkan and CPU backends)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked --features local-llm -- -D warnings

      - name: Test (local-llm)
        working-directory: src-tauri
        run: cargo test --locked --features local-llm

      # Exercise the exact one-installer CPU+Vulkan payload used by releases,
      # not just the feature-off preview. The script rejects mixed/stale llama
      # build outputs and an incomplete runtime/backend DLL set before bundling.
      - name: NSIS smoke bundle (local-llm, Vulkan + CPU fallback)
        run: |
          ./scripts/build-windows.ps1
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*setup.exe'
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)." }

  policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

      - name: DCO signoff
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const failures = [];
            for (const commit of commits) {
              if (commit.author?.login === "dependabot[bot]") continue;

              const author = commit.commit.author;
              const label = commit.sha.slice(0, 7);
              if (!author?.name || !author?.email) {
                failures.push(label + ": commit author name/email is unavailable");
                continue;
              }

              const signoffs = [
                ...commit.commit.message.matchAll(
                  /^Signed-off-by:\s*(.+?)\s*<([^>]+)>\s*$/gim,
                ),
              ];
              const matchesAuthor = signoffs.some(
                ([, name, email]) =>
                  name.trim() === author.name &&
                  email.trim().toLowerCase() === author.email.toLowerCase(),
              );
              if (!matchesAuthor) {
                failures.push(
                  label +
                    ": expected Signed-off-by: " +
                    author.name +
                    " <" +
                    author.email +
                    ">",
                );
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                "DCO signoff missing or mismatched:\n" + failures.join("\n"),
              );
            }

      - name: Main push policy
        if: github.event_name != 'pull_request'
        run: echo "Dependency review and DCO validation apply to pull requests."

  # The single required status check. Naming `frontend` and `rust` directly in
  # the branch ruleset would mean editing repo settings every time a job is
  # added or renamed — and a required check that never runs leaves a PR stuck
  # on "Expected — waiting for status" forever. One stable aggregator avoids
  # both. Add jobs to `needs` and the ruleset keeps working untouched.
  gate:
    name: Quality gate
    needs: [frontend, format, rust, windows, policy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
