       which keeps the pixel-staircase tile for web/favicon use) scaled to 0.94 of the
       body so the cursor block clears the rounded bottom edge. No baked drop shadow —
       current macOS applies its own. Regenerate the raster set with:
         npx tauri icon src-tauri/icons/source.svg -->
