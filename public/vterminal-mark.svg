      <path transform="translate(1.886 0.388) scale(0.020372)" d="M299.832031 431.203125C379.664062 385.238281 457.90625 340.136719 538.882812 293.5L538.882812 431.984375C460.867188 477.140625 381.0625 523.300781 300.421875 569.992188L59.582031 431.59375L59.582031 154.683594C97.726562 132.691406 136.144531 110.5625 178.085938 86.363281L178.085938 360.789062C219.472656 384.707031 259.039062 407.589844 299.863281 431.175781Z"/>
