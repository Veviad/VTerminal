<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.09 1 9.81 14" width="98" height="140">
  <!-- VTerminal in-app mark: the Veviad cube + terminal cursor from the app icon, tile
       removed and cropped to the ink bounds so it fills its box on the app's dark chrome.
       Geometry is the designer's 16-unit master (public/favicon.svg) — the viewBox is the
       only difference, so the userSpaceOnUse gradients below still resolve identically. -->
  <defs>
    <linearGradient id="coolCore" gradientUnits="userSpaceOnUse" x1="1.65" y1="0.91" x2="14.5" y2="15.3">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="10%" stop-color="#dcefff"/><stop offset="24%" stop-color="#fff1cb"/><stop offset="40%" stop-color="#f8fbff"/><stop offset="56%" stop-color="#78adff"/><stop offset="70%" stop-color="#23294d"/><stop offset="83%" stop-color="#f2f5ff"/><stop offset="92%" stop-color="#ffae73"/><stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
